<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cairo; font-weight: 700; src: url(node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2) format("woff2"); }
  @font-face { font-family: CairoLatin; font-weight: 900; src: url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2) format("woff2"); }
  :root { --ink: #141414; --acc: #F26B1D; --bg: #FFFFFF; --mut: #6B6B6B; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: Cairo, CairoLatin, sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #prod { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  /* soft floor shadow so the white photo sits on the page */
  #fade { position: absolute; left: 0; right: 0; bottom: 0; height: 520px;
          background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 70%); }
  .card { position: absolute; left: 60px; right: 250px; top: 250px; text-align: center; opacity: 0; }
  .card span.pill { display: inline-block; background: var(--ink); color: #fff; font-weight: 900;
          font-size: 80px; line-height: 1.3; padding: 18px 44px 26px; border-radius: 28px;
          box-shadow: 0 18px 40px rgba(0,0,0,.18); }
  .card b { color: var(--acc); font-weight: 900; }
  .sub { display: table; margin: 22px auto 0; padding: 6px 26px 12px; border-radius: 16px;
          background: rgba(255,255,255,.94); font-weight: 700; font-size: 44px; color: var(--ink); }
  #end { position: absolute; left: 60px; right: 250px; top: 250px; text-align: center; opacity: 0; }
  #end .price { font-weight: 900; font-size: 150px; color: var(--acc); line-height: 1; }
  #end .price small { font-size: 80px; }
  #end .cod { margin-top: 26px; font-weight: 900; font-size: 58px; }
  #end .cta { display: inline-block; margin-top: 34px; background: var(--ink); color: #fff; font-weight: 900;
              font-size: 56px; padding: 14px 40px 22px; border-radius: 24px; }
  #end .cta b { color: var(--acc); }
</style>
</head>
<body>
<div id="stage">
  <img id="prod" src="product.png">
  <div id="fade"></div>
  <div class="card" id="c0"><span class="pill">حلقة وحدة،<br><b>زوج وضعيات</b></span></div>
  <div class="card" id="c1"><span class="pill">يوقف <b>وحدو</b></span><span class="sub">بلا حامل، تشوف الفيديو بالعرض</span></div>
  <div class="card" id="c2"><span class="pill"><b>ميتال</b>،<br>ماشي بلاستيك</span></div>
  <div class="card" id="c3"><span class="pill">الكاميرا <b>محمية</b></span><span class="sub">إطار مرفوع على العدسات</span></div>
  <div class="card" id="c4"><span class="pill"><b>4</b> كوانات مقوّية</span></div>
  <div class="card" id="c5"><span class="pill">ديزاين الآيفون<br><b>يبان</b></span></div>
  <div id="end">
    <div class="price">2900 <small>دج</small></div>
    <div class="cod">الدفع عند الاستلام · 58 ولاية</div>
    <div class="cta">اكتب <b>«كوك»</b> في الكومنتار</div>
  </div>
</div>
<script>
// Camera keyframes over the 1080x1080 photo: [time s, centre x, centre y, zoom].
// Between keyframes the camera eases; inside a scene it drifts slowly (ken burns).
const CAM = [
  [0.0,  267, 548, 2.05], [1.9,  267, 548, 2.25],   // ring
  [2.4,  640, 790, 1.55], [4.1,  640, 790, 1.68],   // right phone on its stand
  [4.6,  250, 540, 1.10], [6.1,  250, 540, 1.18],   // left phone, metal frame
  [6.6,  265, 215, 2.10], [8.1,  265, 215, 2.25],   // camera frame
  [8.6,  150, 900, 2.20], [10.1, 150, 900, 2.35],   // bottom corner + orange detail
  [10.6, 540, 545, 0.98], [12.2, 540, 545, 1.03],   // whole product
  [12.7, 540, 346, 0.62], [15.6, 540, 346, 0.65],   // end card: product below the price
  [16.4, 267, 548, 2.05]                            // back to the ring: loops into frame 1
];
const CARDS = [["c0", 0.0, 2.15], ["c1", 2.45, 4.35], ["c2", 4.65, 6.35],
               ["c3", 6.65, 8.35], ["c4", 8.65, 10.35], ["c5", 10.65, 12.45]];
const END = [12.75, 15.9];
const ANCHOR_Y = 960;                       // canvas y where the camera centre sits
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const clamp01 = x => Math.max(0, Math.min(1, x));

function camAt(t) {
  if (t <= CAM[0][0]) return CAM[0].slice(1);
  for (let i = 0; i < CAM.length - 1; i++) {
    const [t0, x0, y0, z0] = CAM[i], [t1, x1, y1, z1] = CAM[i + 1];
    if (t <= t1) {
      const moving = (i % 2 === 1);           // odd index -> transition between scenes
      const k = (t - t0) / (t1 - t0);
      const e = moving ? ease(k) : k;
      return [x0 + (x1 - x0) * e, y0 + (y1 - y0) * e, z0 + (z1 - z0) * e];
    }
  }
  return CAM[CAM.length - 1].slice(1);
}

function fadeInOut(el, t, a, b, rise) {
  const inK = clamp01((t - a) / 0.25), outK = clamp01((b - t) / 0.2);
  const o = a <= 0.001 ? outK : Math.min(inK, outK);   // hook card is up at frame 1
  const k = a <= 0.001 ? 1 : ease(inK);
  el.style.opacity = (t < a || t > b) ? 0 : o;
  el.style.transform = `translateY(${(1 - k) * rise}px)`;
}

window.render = function (t) {
  const [cx, cy, z] = camAt(t);
  document.getElementById("prod").style.transform =
    `translate(${540 - cx * z}px, ${ANCHOR_Y - cy * z}px) scale(${z})`;
  for (const [id, a, b] of CARDS) fadeInOut(document.getElementById(id), t, a, b, 40);
  fadeInOut(document.getElementById("end"), t, END[0], END[1], 60);
};
window.render(0);
</script>
</body>
</html>
