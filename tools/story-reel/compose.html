<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cairo; font-weight: 900; src: url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2) format("woff2"); }
  @font-face { font-family: Cairo; font-weight: 700; src: url(node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2) format("woff2"); }
  @font-face { font-family: CairoLatin; font-weight: 900; src: url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2) format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: Cairo, CairoLatin, sans-serif; }
  svg { position: absolute; inset: 0; }
  #cap { position: absolute; left: 60px; right: 250px; top: 1250px; text-align: center; }
  #cap span { display: inline-block; background: rgba(18,14,10,.72); color: #fff; font-weight: 900;
              font-size: 60px; line-height: 1.35; padding: 14px 36px 22px; border-radius: 26px; }
  #cap b { color: #FFC24B; }
  #moral { position: absolute; left: 60px; right: 250px; top: 560px; text-align: center; opacity: 0;
           color: #fff; font-weight: 900; font-size: 64px; line-height: 1.45; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  #moral small { display: block; font-size: 44px; color: #FFC24B; margin-bottom: 26px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #day { position: absolute; left: 60px; right: 250px; top: 250px; text-align: center; opacity: 0;
         color: #fff; font-weight: 900; font-size: 110px; text-shadow: 0 6px 24px rgba(0,0,0,.45); }
</style>
</head>
<body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0" stop-color="#F2A65A"/><stop id="skyBot" offset="1" stop-color="#FCE2A8"/>
    </linearGradient>
    <radialGradient id="sunG"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".55" stop-color="#FFD452"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
    <linearGradient id="groundG" gradientUnits="userSpaceOnUse" x1="0" y1="1050" x2="0" y2="2350">
      <stop id="gTop" offset="0" stop-color="#D9A055"/><stop id="gBot" offset="1" stop-color="#B9823F"/>
    </linearGradient>
  </defs>
  <g id="world">
    <rect x="-700" y="-700" width="2480" height="1760" fill="url(#skyG)"/>
    <g id="stars" opacity="0"></g>
    <circle id="sun" cx="800" cy="330" r="170" fill="url(#sunG)"/>
    <circle id="moon" cx="800" cy="330" r="70" fill="#F4F1E1" opacity="0"/>
    <g id="heat" stroke="#FFF3D0" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"></g>
    <!-- distant village and palms -->
    <g id="village" fill="#E9C58C">
      <rect x="40" y="975" width="90" height="80" rx="6"/><rect x="140" y="955" width="70" height="100" rx="6"/>
      <path d="M140 957 Q175 905 210 957 Z"/><rect x="220" y="990" width="110" height="65" rx="6"/>
      <rect x="342" y="970" width="60" height="85" rx="6"/>
      <path d="M470 1055 L478 940" stroke="#9A6B3A" stroke-width="10"/><g fill="#7FA05A">
      <path d="M478 940 q-60 -10 -85 25 q50 -15 85 -25"/><path d="M478 940 q60 -10 85 25 q-50 -15 -85 -25"/>
      <path d="M478 940 q-30 -45 -75 -45 q45 10 75 45"/><path d="M478 940 q30 -45 75 -45 q-45 10 -75 45"/></g>
    </g>
    <rect x="-700" y="1050" width="2480" height="1300" fill="url(#groundG)"/>
    <g id="cracks" stroke="#9E6A33" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M80 1120 l40 20 l-10 30 l45 15"/><path d="M600 1100 l35 25 l40 -10 l20 30"/>
      <path d="M880 1210 l-40 15 l-20 35"/><path d="M330 1230 l50 -10 l25 25"/>
    </g>
    <g id="grass" opacity="0"></g>
    <g id="holes"></g>
    <!-- B's well: hole, mound, water pool -->
    <ellipse id="wellPool" cx="800" cy="1165" rx="0" ry="0" fill="#3E8FD6" opacity=".9"/>
    <ellipse id="well" cx="800" cy="1165" rx="0" ry="0" fill="#4A2F17"/>
    <path id="mound" d="M880 1175 Q930 1060 990 1175 Z" fill="#A8723A" transform="translate(935 1175) scale(0) translate(-935 -1175)"/>
    <g id="farmerB"></g>
    <rect id="bFront" x="690" y="1165" width="200" height="160" fill="url(#groundG)" opacity="0"/>
    <g id="farmerA"></g>
    <g id="bucket" transform="translate(540 1170)">
      <path d="M-34 -60 L34 -60 L26 0 L-26 0 Z" fill="#8C939C"/><ellipse cx="0" cy="-60" rx="34" ry="9" fill="#5E646B"/>
      <path d="M-30 -60 Q0 -110 30 -60" stroke="#5E646B" stroke-width="5" fill="none"/>
    </g>
    <g id="drops"></g>
    <g id="laugh" opacity="0"></g>
  </g>
</svg>
<div id="flash"></div>
<div id="day"></div>
<div id="cap"><span id="capText"></span></div>
<div id="moral"><small>حكمة اليوم</small>اللي يحفر في بزاف بلايص،<br>ما يوصل للما<br>في حتى وحدة.</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function mix(c1, c2, k) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2);
  return "#" + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, "0")).join("");
}

// ---------- scenes: one bar of music = 2.2 s ----------
const BAR = 2.2;
const SCENES = [
  { bars: 2, cap: "في قرية بعيدة، وقت الصيف...<br><b>الما كمل.</b>",          cam: [540, 820, 1.15] },
  { bars: 1, cap: "زوج فلاحين خرجو <b>يحفرو بير.</b>",                         cam: [540, 900, 1.25] },
  { bars: 1, cap: "الأول حفر شوية... <b>ما لقا والو.</b>",                    cam: [300, 960, 1.6] },
  { bars: 1, cap: "قال: البلاصة هادي <b>ماشي مليحة.</b>",                     cam: [250, 960, 1.6] },
  { bars: 2, cap: "حفر وراح... حتى ولّات الأرض<br><b>كاملة غيران.</b>",       cam: [330, 940, 1.3] },
  { bars: 1, cap: "الثاني بقى في <b>بلاصة وحدة.</b>",                          cam: [790, 960, 1.6] },
  { bars: 2, cap: "يوم، زوج، ثلاثة...<br>والناس <b>ضحكو عليه.</b>",            cam: [820, 940, 1.35] },
  { bars: 1, cap: "في اليوم الخامس، ضرب <b>ضربة وحدة...</b>",                 cam: [800, 980, 1.7] },
  { bars: 1, cap: "<b>والما طلع!</b>",                                         cam: [800, 900, 1.35] },
  { bars: 2, cap: "الأول حفر <b>عشرة غيران</b>،<br>والثاني حفر <b>بير</b>.",   cam: [520, 930, 1.2] },
  { bars: 2, cap: "",                                                          cam: [540, 860, 1.1], moral: true },
];
let acc = 0;
for (const s of SCENES) { s.start = acc; s.dur = s.bars * BAR; acc += s.dur; }
const TOTAL = acc;
const sceneAt = t => { let i = SCENES.length - 1; while (i > 0 && t < SCENES[i].start) i--; return i; };

// ---------- farmers ----------
function farmer(root, color, hat) {
  const g = el("g", {}, root);
  const body = el("g", {}, g);
  el("path", { d: "M-18 0 L-12 -90 M18 0 L12 -90", stroke: "#3B2A1A", "stroke-width": 14, "stroke-linecap": "round" }, body);
  el("rect", { x: -40, y: -205, width: 80, height: 125, rx: 34, fill: color }, body);
  el("circle", { cx: 0, cy: -238, r: 34, fill: "#C98B5B" }, body);
  el("circle", { cx: -11, cy: -242, r: 4, fill: "#2A1C10" }, body);
  el("circle", { cx: 11, cy: -242, r: 4, fill: "#2A1C10" }, body);
  const mouth = el("path", { d: "M-11 -224 L11 -224", stroke: "#2A1C10", "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, body);
  if (hat === "straw") {
    el("ellipse", { cx: 0, cy: -262, rx: 60, ry: 12, fill: "#E8C36A" }, body);
    el("path", { d: "M-28 -262 Q0 -308 28 -262 Z", fill: "#E8C36A" }, body);
    el("rect", { x: -28, y: -270, width: 56, height: 7, fill: "#B0442E" }, body);
  } else {
    el("path", { d: "M-38 -252 Q-40 -292 0 -296 Q40 -292 38 -252 Q0 -266 -38 -252 Z", fill: "#F4F1E8" }, body);
    el("path", { d: "M-36 -262 Q0 -276 36 -262", stroke: "#D8D2C2", "stroke-width": 5, fill: "none" }, body);
  }
  const arm = el("g", {}, body);
  el("line", { x1: 0, y1: 0, x2: 0, y2: 78, stroke: "#C98B5B", "stroke-width": 15, "stroke-linecap": "round" }, arm);
  el("line", { x1: 0, y1: 55, x2: 0, y2: 205, stroke: "#6B4A2B", "stroke-width": 9, "stroke-linecap": "round" }, arm);
  el("path", { d: "M-24 200 L24 200 L18 242 Q0 256 -18 242 Z", fill: "#A3ACB6" }, arm);
  return { g, body, arm, mouth, x: 0, y: 0 };
}
const A = farmer($("farmerA"), "#3F7FBF", "straw");
const B = farmer($("farmerB"), "#4E9A5E", "chech");
function placeF(f, x, y, s = 1, flip = 1) { f.g.setAttribute("transform", `translate(${x} ${y}) scale(${s * flip} ${s})`); }
function armF(f, deg, bob = 0) { f.arm.setAttribute("transform", `translate(0 ${-175 + bob}) rotate(${deg})`); f.body.setAttribute("transform", `translate(0 ${bob})`); }
const MOUTH = { neutral: "M-11 -224 L11 -224", smile: "M-13 -226 Q0 -212 13 -226", frown: "M-12 -218 Q0 -230 12 -218", open: "M-10 -226 Q0 -206 10 -226 Z" };
const mouthF = (f, m) => f.mouth.setAttribute("d", MOUTH[m]);
const dig = (t, speed = 2.4) => -30 + 45 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 * speed));

// ---------- props ----------
const HOLES = [[300, 1150], [170, 1110], [430, 1100], [110, 1200], [250, 1225], [520, 1140], [380, 1215], [60, 1120], [560, 1215], [215, 1170]];
const holeEls = HOLES.map(([x, y]) => {
  const g = el("g", { transform: `translate(${x} ${y}) scale(0)` }, $("holes"));
  el("ellipse", { cx: 0, cy: 0, rx: 52, ry: 18, fill: "#4A2F17" }, g);
  el("path", { d: "M-60 2 Q0 26 60 2", stroke: "#A8723A", "stroke-width": 8, fill: "none", "stroke-linecap": "round" }, g);
  return g;
});
for (let i = 0; i < 6; i++) el("path", { d: `M${120 + i * 160} 1040 q12 -25 0 -50 q-12 -25 0 -50`, "data-i": i }, $("heat"));
for (let i = 0; i < 40; i++) el("circle", { cx: (i * 137) % 1080, cy: 60 + (i * 89) % 800, r: 2 + (i % 3), fill: "#fff" }, $("stars"));
for (let i = 0; i < 26; i++) {
  const x = 620 + (i * 53) % 420, y = 1090 + (i * 37) % 150;
  el("path", { d: `M${x} ${y} q-6 -26 -16 -34 M${x} ${y} q2 -30 10 -40 M${x} ${y} q8 -20 20 -26`, stroke: "#5FA33F", "stroke-width": 6, fill: "none", "stroke-linecap": "round" }, $("grass"));
}
const DROPS = Array.from({ length: 70 }, (_, i) => ({ a: -Math.PI / 2 + (((i * 0.6180339) % 1) - 0.5) * 1.1, v: 700 + ((i * 0.7548) % 1) * 600, ph: (i * 0.3819) % 1,
  e: el("circle", { r: 9 + (i % 4) * 3, fill: i % 3 ? "#5FB2F2" : "#BFE3FF" }, $("drops")) }));
const LAUGH = [];
for (let i = 0; i < 3; i++) {
  const g = el("g", {}, $("laugh"));
  el("circle", { cx: 0, cy: -60, r: 16, fill: "#B07A4E" }, g); el("rect", { x: -16, y: -44, width: 32, height: 50, rx: 14, fill: ["#B0442E", "#7B5EA7", "#C9902C"][i] }, g);
  const txt = el("text", { x: 0, y: -95, "font-size": 34, "font-weight": 900, "text-anchor": "middle", fill: "#5A2A12", "font-family": "Cairo" }, g); txt.textContent = "ههه";
  LAUGH.push(g);
}

// ---------- render ----------
const camAt = t => {
  const i = sceneAt(t), s = SCENES[i], prev = SCENES[Math.max(0, i - 1)];
  const k = i === 0 ? 1 : ease(clamp01((t - s.start) / 0.45));
  return s.cam.map((v, j) => lerp(prev.cam[j], v, k));
};

window.render = function (t) {
  const i = sceneAt(t), s = SCENES[i], lt = t - s.start;
  // camera (+ shake on the strike)
  let [cx, cy, z] = camAt(t);
  z *= 1 + 0.02 * (lt / s.dur);
  let sx = 0, sy = 0;
  if (i === 7 && lt > 1.2) { const d = Math.exp(-(lt - 1.2) * 6); sx = Math.sin(lt * 90) * 18 * d; sy = Math.cos(lt * 77) * 14 * d; }
  $("world").setAttribute("transform", `translate(${540 - cx * z + sx} ${760 - cy * z + sy}) scale(${z})`);

  // sky: day/night cycle in scene 6, cooler after the water
  let night = 0;
  if (i === 6) night = 0.5 - 0.5 * Math.cos(lt / s.dur * Math.PI * 2 * 2);
  const after = i >= 8 ? clamp01((t - SCENES[8].start) / 1.0) : 0;
  $("skyTop").setAttribute("stop-color", mix(mix("#F2A65A", "#7EC3E8", after), "#1D2748", night));
  $("skyBot").setAttribute("stop-color", mix(mix("#FCE2A8", "#E6F4D9", after), "#3C4A6E", night));
  $("gTop").setAttribute("stop-color", mix(mix("#D9A055", "#B98A4A", after), "#5A4630", night));
  $("stars").setAttribute("opacity", night);
  const sunY = 330 + night * 900;
  $("sun").setAttribute("cy", sunY); $("sun").setAttribute("r", 170 + 8 * Math.sin(t * 3));
  $("moon").setAttribute("opacity", clamp01(night * 1.6 - 0.4)); $("moon").setAttribute("cy", 300 + (1 - night) * 500);
  [...$("heat").children].forEach((p, k) => p.setAttribute("transform", `translate(0 ${-((t * 60 + k * 30) % 120)})`));
  $("heat").setAttribute("opacity", i <= 1 ? 0.55 : 0);
  $("cracks").setAttribute("opacity", after ? 0.8 * (1 - after) : 0.8);
  $("grass").setAttribute("opacity", after);
  $("grass").setAttribute("transform", `translate(0 ${(1 - after) * 30})`);
  $("bucket").setAttribute("opacity", i <= 1 ? 1 : 0);
  $("bucket").setAttribute("transform", `translate(540 1170) rotate(${i === 0 ? Math.min(80, lt * 30) : 80} 0 0)`);

  // holes dug by A
  const nHoles = i < 2 ? 0 : i === 2 ? clamp01(lt / 1.6) : i === 3 ? 1 + clamp01((lt - 1.2) / 0.8) : i === 4 ? 2 + lt / s.dur * 8 : 10;
  holeEls.forEach((h, k) => { const sc = ease(clamp01(nHoles - k)); h.setAttribute("transform", `translate(${HOLES[k][0]} ${HOLES[k][1]}) scale(${sc})`); });

  // farmer A
  let ax = 300, ay = 1150, aflip = 1, adeg = 20, abob = 0, am = "neutral";
  if (i === 0) { ax = -200; }
  else if (i === 1) { ax = lerp(-150, 230, ease(clamp01(lt / 1.8))); abob = Math.abs(Math.sin(lt * 9)) * -8; }
  else if (i === 2) { ax = 230; adeg = lt < 1.6 ? dig(lt) : 60; am = lt < 1.6 ? "neutral" : "frown"; abob = lt < 1.6 ? Math.sin(lt * 15) * 4 : 0; }
  else if (i === 3) { ax = lerp(230, 110, ease(clamp01((lt - 0.4) / 0.8))); aflip = lt > 0.3 && lt < 1.2 ? -1 : 1; adeg = lt < 1.2 ? 15 : dig(lt); am = "frown"; }
  else if (i === 4) { const k = Math.min(9, 2 + Math.floor(lt / s.dur * 8)); const [hx, hy] = HOLES[Math.max(1, k - 1)]; ax = hx - 70; ay = hy; adeg = dig(lt, 3.2); am = "frown"; }
  else if (i >= 5) { ax = 200; ay = 1150; adeg = 70; am = "frown"; }
  if (i === 9) { ax = 230; ay = 1150; adeg = 85; am = "frown"; abob = 10; }
  placeF(A, ax, ay, 1, aflip); armF(A, adeg, abob); mouthF(A, am);

  // farmer B and his well
  let bx = 800, by = 1165, bdeg = 20, bbob = 0, bm = "neutral", depth = 0, well = 0, mound = 0;
  if (i === 0) bx = 1300;
  else if (i === 1) { bx = lerp(1250, 800, ease(clamp01(lt / 1.8))); bbob = Math.abs(Math.sin(lt * 9)) * -8; bdeg = 10; }
  else if (i <= 4) { bdeg = dig(t, 1.6); well = 0.35 + 0.1 * (i - 2); mound = 0.2 + 0.08 * (i - 2); bm = "neutral"; }
  else if (i === 5) { bdeg = dig(lt, 2.2); well = 0.6 + 0.1 * lt / s.dur; mound = 0.45 + 0.15 * lt / s.dur; depth = 25 * lt / s.dur; }
  else if (i === 6) { bdeg = dig(lt, 2.6); well = 0.75; mound = 0.6 + 0.3 * lt / s.dur; depth = 25 + 85 * lt / s.dur; bm = "frown"; }
  else if (i === 7) { well = 0.8; mound = 0.95; depth = 110; bdeg = lt < 1.0 ? lerp(20, -150, ease(clamp01(lt / 1.0))) : lt < 1.2 ? lerp(-150, 60, (lt - 1.0) / 0.2) : 60; bm = lt > 1.2 ? "open" : "frown"; }
  else if (i === 8) { well = 0.8; mound = 0.95; depth = lerp(110, -40, ease(clamp01(lt / 0.9))); bdeg = -150 + 20 * Math.sin(lt * 10); bm = "smile"; }
  else { well = 0.8; mound = 0.95; depth = 0; bdeg = -120; bm = "smile"; }
  placeF(B, bx, by + depth, 1, -1); armF(B, bdeg, bbob); mouthF(B, bm);
  $("well").setAttribute("rx", 75 * well); $("well").setAttribute("ry", 24 * well);
  $("bFront").setAttribute("opacity", depth > 0 ? 1 : 0);
  $("mound").setAttribute("transform", `translate(935 1175) scale(${mound}) translate(-935 -1175)`);
  const pool = i >= 8 ? ease(clamp01((t - SCENES[8].start) / 0.8)) : 0;
  $("wellPool").setAttribute("rx", 75 * well + 120 * pool); $("wellPool").setAttribute("ry", 24 * well + 34 * pool);

  // water fountain
  const fountain = i === 8 ? 1 : i >= 9 ? 0.35 : 0;
  DROPS.forEach(d => {
    if (!fountain) { d.e.setAttribute("opacity", 0); return; }
    const life = 1.0, tt = ((t * 1.0 + d.ph * life) % life);
    const v = d.v * fountain;
    const x = 800 + Math.cos(d.a) * v * tt, y = 1150 + Math.sin(d.a) * v * tt + 0.5 * 1500 * tt * tt;
    d.e.setAttribute("cx", x); d.e.setAttribute("cy", Math.min(y, 1165)); d.e.setAttribute("opacity", y < 1165 ? 0.9 : 0);
  });

  // laughing villagers
  $("laugh").setAttribute("opacity", i === 6 ? clamp01(lt / 0.3) : 0);
  LAUGH.forEach((g, k) => g.setAttribute("transform", `translate(${930 + k * 55} ${1085 + Math.abs(Math.sin(t * 8 + k)) * -12}) scale(.9)`));

  // day counter
  const dayEl = $("day");
  if (i === 6) { dayEl.textContent = "يوم " + (1 + Math.min(3, Math.floor(lt / s.dur * 4))); dayEl.style.opacity = 1; }
  else if (i === 7) { dayEl.textContent = "اليوم 5"; dayEl.style.opacity = clamp01((1.1 - lt) / 0.2); }
  else dayEl.style.opacity = 0;

  // flash on the strike, captions, moral
  $("flash").style.opacity = i === 7 && lt > 1.2 ? 0.8 * Math.exp(-(lt - 1.2) * 8) : 0;
  const capIn = i === 0 ? 1 : ease(clamp01((lt - 0.05) / 0.25)), capOut = clamp01((s.dur - 0.15 - lt) / 0.2);
  $("capText").innerHTML = s.cap; $("capText").style.display = s.cap ? "inline-block" : "none";
  $("cap").style.opacity = Math.min(capIn, capOut); $("cap").style.transform = `translateY(${(1 - capIn) * 30}px)`;
  const mo = s.moral ? ease(clamp01((lt - 0.1) / 0.5)) : 0;
  $("moral").style.opacity = mo; $("moral").style.transform = `translateY(${(1 - mo) * 40}px)`;
  document.body.style.setProperty("--dim", mo);
  $("world").style.filter = s.moral ? `brightness(${1 - 0.55 * mo}) blur(${6 * mo}px)` : "none";
};
window.TOTAL = TOTAL;
window.render(0);
</script>
</body>
</html>
