# Pull product photos from a product page (or save one image URL). The Claude
# session's network cannot reach most shops, the runner can. Requests are
# pushed by tools/remote/job.sh web-grab ...; results come back on
# refs/web-grab/<id>. See tools/web-grab/README.md.
name: web-grab

on:
  push:
    paths:
      - 'tools/web-grab/requests/**'

permissions:
  contents: write

concurrency:
  group: web-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -q pillow

      - name: Collect requests
        env:
          BEFORE: ${{ github.event.before }}
        run: bash tools/remote/collect.sh web-grab "$RUNNER_TEMP/req"

      - name: Run
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/req/*.txt; do
            id=$(basename "$f" .txt)
            python tools/web-grab/grab.py --request-file "$f" --out "$RUNNER_TEMP/out/$id" || true
          done

      - name: Publish results
        if: always()
        run: bash tools/remote/publish.sh web-grab "$RUNNER_TEMP/out"
